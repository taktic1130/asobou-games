<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff7eb6">
<link rel="icon" href="icon-192.png">
<script>if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js");</script>
<title>シールちょう</title>
<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Meiryo", sans-serif; color: #c2185b;
    background: #fff8fb radial-gradient(#ffd6e8 2px, transparent 2.5px) 0 0 / 28px 28px; overflow-y: auto; touch-action: pan-y; }
  #home { position: fixed; top: 14px; left: 14px; width: 72px; height: 72px; font-size: 36px; border-radius: 50%; padding: 0;
    background: #ff7eb6; border: 6px solid #fff; box-shadow: 0 6px 0 rgba(0,0,0,.15); z-index: 5; }
  h1 { text-align: center; margin: 22px 0 6px; font-size: clamp(30px, 5vw, 52px); text-shadow: 3px 3px 0 #ffe066; }
  #count { text-align: center; font-size: clamp(22px, 3.4vw, 34px); font-weight: bold; color: #8a4b00; margin-bottom: 14px; }
  .book { max-width: 1100px; margin: 0 auto 40px; padding: 18px; background: #fffbe6; border-radius: 34px; border: 8px solid #ffc93c;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(74px, 11vw, 120px), 1fr)); gap: 12px; }
  @media (max-width: 600px) { .book { margin: 0 12px 40px; } }
  .s { aspect-ratio: 1; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center;
    font-size: clamp(40px, 6.5vw, 70px); position: relative; border: 4px dashed #ffd6e8; }
  .s.got { border: 4px solid #ff9fca; box-shadow: 0 5px 0 rgba(0,0,0,.08); animation: pop .5s both; }
  .s.no span { filter: grayscale(1) brightness(0); opacity: .1; }
  .s .n { position: absolute; right: -4px; bottom: -4px; background: #ff4f9a; color: #fff; font-size: 16px; font-weight: bold;
    border-radius: 14px; padding: 2px 8px; border: 3px solid #fff; }
  .s:active { transform: scale(.9); }
  @keyframes pop { 0% { transform: scale(.4); } 70% { transform: scale(1.1); } }
</style>
</head>
<body>
<button id="home" onclick="location.href='index.html'">🏠</button>
<h1>📒 シールちょう</h1>
<div id="count"></div>
<div class="book" id="book"></div>
<script src="common.js"></script>
<script>
  const have = Asobou.getStickers(), book = document.getElementById('book');
  let n = 0;
  Asobou.STICKERS.forEach((s, i) => {
    const d = document.createElement('div'), got = have[s] > 0;
    d.className = 's ' + (got ? 'got' : 'no');
    d.innerHTML = `<span>${s}</span>` + (have[s] > 1 ? `<div class="n">×${have[s]}</div>` : '');
    if (got) { n++; d.style.animationDelay = (i * 0.02) + 's'; }
    d.addEventListener('pointerdown', () => {
      if (got) { Asobou.S.pop(); const r = d.getBoundingClientRect(); Asobou.fx(r.left + r.width / 2, r.top, s); }
      else { Asobou.S.tap(); }
    });
    book.appendChild(d);
  });
  document.getElementById('count').textContent = `${n} / ${Asobou.STICKERS.length} まい あつめたよ`;
  setTimeout(() => Asobou.say(n ? `シールが ${n}まい あるよ！` : 'ゲームで あそぶと シールが もらえるよ！'), 400);
</script>
</body>
</html>
