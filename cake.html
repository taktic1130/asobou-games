<script>
const A = Asobou, S = A.S, $ = id => document.getElementById(id);
const cv = $('c'), ctx0 = cv.getContext('2d'); let ctx = ctx0;
const creamC = document.createElement('canvas'), cream = creamC.getContext('2d');
const cakeL = document.createElement('canvas'), cakeX = cakeL.getContext('2d');

let W, H, U, DPR;

const SHAPES = { maru: '⭕', heart: '💗', star: '⭐', shikaku: '🟪' };

// ---------- トッピングの え（x,y は したの まんなか、s は おおきさ） ----------

      c.quadraticCurveTo(x, y + s * .02, x + s * .05, y - s * .03);

      c.fillStyle = 'rgba(120,0,0,.35)'; c.beginPath(); c.ellipse(sx + s * .008, sy + s * .012, s * .024, s * .034, .3, 0, 7); c.fill();
      c.fillStyle = '#ffe04a'; c.beginPath(); c.ellipse(sx, sy, s * .02, s * .03, .3, 0, 7); c.fill();
    }

  } else if (k === 'whip') {

    }
    c.fillStyle = '#ffffff'; c.beginPath(); c.moveTo(x - s * .1, y - s * .6); c.quadraticCurveTo(x + s * .02, y - s * .7, x + s * .06, y - s * .88); c.quadraticCurveTo(x + s * .1, y - s * .66, x + s * .12, y - s * .6); c.fill();
  } else if (k === 'cherry') {
    c.strokeStyle = '#5a8f3a'; c.lineWidth = Math.max(1.5, s * .04); c.lineCap = 'round';
    c.beginPath(); c.moveTo(x - s * .17, y - s * .38); c.quadraticCurveTo(x - s * .1, y - s * .8, x + s * .08, y - s * .95); c.stroke();
    c.beginPath(); c.moveTo(x + s * .2, y - s * .4); c.quadraticCurveTo(x + s * .15, y - s * .75, x + s * .08, y - s * .95); c.stroke();
    ell(x + s * .14, y - s * .97, s * .12, s * .05, '#6fbf4a', -.4);
    for (const dx of [-.17, .2]) { ell(x + dx * s, y - s * .22, s * .21, s * .2, '#d81b45'); shine(x + dx * s - s * .07, y - s * .29, s * .06); }
  } else if (k === 'berry') {
    for (const [dx, dy] of [[-.17, .17], [.17, .17], [0, .4]]) {
      ell(x + dx * s, y - dy * s, s * .19, s * .18, '#3f3f8f');
      ell(x + dx * s, y - dy * s - s * .1, s * .06, s * .03, '#232360'); shine(x + dx * s - s * .07, y - dy * s - s * .05, s * .045);
    }
  } else if (k === 'macaron') {
    const col = MACA[v % MACA.length];
    ell(x, y - s * .16, s * .4, s * .16, col); c.fillStyle = col; c.fillRect(x - s * .4, y - s * .3, s * .8, s * .14);
    ell(x, y - s * .3, s * .4, s * .16, 'rgba(0,0,0,.08)');
    c.fillStyle = '#fffaf0'; c.fillRect(x - s * .37, y - s * .38, s * .74, s * .08);
    ell(x, y - s * .44, s * .4, s * .16, col); c.fillStyle = col; c.fillRect(x - s * .4, y - s * .56, s * .8, s * .12);
    ell(x, y - s * .56, s * .4, s * .16, col); ell(x, y - s * .56, s * .4, s * .16, 'rgba(255,255,255,.25)'); shine(x - s * .15, y - s * .6, s * .07);
  } else if (k === 'choco') {
    c.fillStyle = '#7b4a2e'; c.beginPath(); c.moveTo(x, y - s * .05);
    c.bezierCurveTo(x - s * .55, y - s * .4, x - s * .3, y - s * .85, x, y - s * .6);

    c.fillStyle = '#e8b464'; c.beginPath(); pts.forEach(([px, py], i) => i ? c.lineTo(px, py) : c.moveTo(px, py)); c.closePath(); c.fill();

    ell(x, y - s * .42, s * .07, s * .07, '#ff8fc4');

    ell(x, y - s * .4, s * .1, s * .12, '#f4f8e0');
    for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2; ell(x + Math.cos(a) * s * .17, y - s * .4 + Math.sin(a) * s * .17, s * .025, s * .04, '#2b2b1a', a); }
  } else if (k === 'pearl') {
    for (const [dx, dy] of [[-.22, .12], [.05, .1], [.26, .16], [-.08, .3], [.18, .34]]) {
      const px = x + dx * s, py = y - dy * s, r = s * .1;
      const g = c.createRadialGradient(px - r * .4, py - r * .4, r * .1, px, py, r); g.addColorStop(0, '#ffffff'); g.addColorStop(1, v % 2 ? '#f0c040' : '#a9adc0');
      c.fillStyle = g; c.beginPath(); c.arc(px, py, r, 0, 7); c.fill();

    c.save(); c.translate(x, y - s * .1); c.rotate(-.5 + (v % 3) * .25);
    c.fillStyle = '#e8c27a'; c.fillRect(-s * .05, -s * .2, s * .1, s * .2);
    c.fillStyle = '#6a3c24'; c.beginPath(); c.moveTo(-s * .06, -s * .2); c.lineTo(-s * .06, -s * .95); c.arc(0, -s * .95, s * .06, Math.PI, 0); c.lineTo(s * .06, -s * .2); c.fill();
    c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(-s * .035, -s * .9, s * .02, s * .6);

  }
}
function iconCanvas(btn, fn) {
  const cv2 = document.createElement('canvas'); cv2.style.cssText = 'width:100%;height:100%;display:block;pointer-events:none'; btn.appendChild(cv2);
  requestAnimationFrame(() => {
    const r = cv2.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1);
    cv2.width = r.width * d; cv2.height = r.height * d; const c = cv2.getContext('2d'); c.setTransform(d, 0, 0, d, 0, 0); fn(c, r.width, r.height);
  });
}
function candleFill(c, col, x, y, w, h) {
  if (col === 'rainbow') { RAINBOW.forEach((cc, i) => { c.fillStyle = cc; c.fillRect(x, y + i * h / 6, w, h / 6 + .5); }); return; }
  c.fillStyle = col; c.fillRect(x, y, w, h);
  c.save(); c.beginPath(); c.rect(x, y, w, h); c.clip(); c.translate(x, y);
  c.fillStyle = col === '#ffffff' ? 'rgba(255,126,182,.7)' : 'rgba(255,255,255,.7)';
  for (let k = -1; k < 6; k++) { c.beginPath(); c.moveTo(0, k * h / 5); c.lineTo(w, k * h / 5 - w * .8); c.lineTo(w, k * h / 5 - w * .8 + h / 14); c.lineTo(0, k * h / 5 + h / 14); c.fill(); }
  c.restore();
  if (col === '#ffffff') { c.strokeStyle = 'rgba(0,0,0,.15)'; c.lineWidth = 1; c.strokeRect(x, y, w, h); }
}
const NUM = ['', 'いっぽん', 'にほん', 'さんぼん', 'よんほん', 'ごほん', 'ろっぽん', 'ななほん', 'はっぽん', 'きゅうほん', 'じゅっぽん'];
let plate = null, plateImg = null, bites = [], slices = [], served = 0, eatDone = false;
let shape = 'maru', step = 'shape', creamCol = 0, topSel = 0, painted = 0, cells = [], tops = [], candles = [], sprinkle = false;
let parts = [], time = 0, dark = 0, down = null, bday, guests = [], cheer = 0, songT = null;

// ---------- かたち ----------
function shapePts(kind) {
  const p = [];
  if (kind === 'maru') for (let i = 0; i < 60; i++) { const a = i / 60 * Math.PI * 2; p.push([Math.cos(a), Math.sin(a)]); }
  else if (kind === 'heart') for (let i = 0; i < 80; i++) { const t = i / 80 * Math.PI * 2; p.push([16 * Math.pow(Math.sin(t), 3) / 17, -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 17 - .1]); }
  else if (kind === 'star') for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i / 10 * Math.PI * 2, r = i % 2 ? .55 : 1.05; p.push([Math.cos(a) * r, Math.sin(a) * r + .05]); }
  else { const r = .2; for (const [cx, cy, a0] of [[.8, -.8, -90], [.8, .8, 0], [-.8, .8, 90], [-.8, -.8, 180]]) for (let k = 0; k <= 8; k++) { const a = (a0 + k * 90 / 8) * Math.PI / 180; p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } }
  return p;
}
function geo() { const R = Math.min(W * .27, H * .4); return { cx: W * .5, ty: H * .47, R, D: R * .42 }; }
function addShape(path, kind, dy = 0, sc = 1) {
  const g = geo(), p = shapePts(kind);
  p.forEach(([x, y], i) => { const X = g.cx + x * g.R * sc, Y = g.ty + y * g.R * .5 * sc + dy; i ? path.lineTo(X, Y) : path.moveTo(X, Y); });
  path.closePath();
}
function topPath() { const p = new Path2D(); addShape(p, shape); return p; }
function regionPath() { const g = geo(), p = new Path2D(); for (let d = 0; d <= g.D; d += 3) addShape(p, shape, d); return p; }
let TOP, REG;
function rebuild() {
  TOP = topPath(); REG = regionPath();
  cells = []; const g = geo(), s = U * 3;
  for (let y = g.ty - g.R; y < g.ty + g.R + g.D; y += s) for (let x = g.cx - g.R * 1.1; x < g.cx + g.R * 1.1; x += s) if (test.isPointInPath(REG, x, y)) cells.push({ x, y, on: false });
}
function resize() {

  for (const c of [cv, creamC, cakeL]) { c.width = W * DPR; c.height = H * DPR; }
  ctx0.setTransform(DPR, 0, 0, DPR, 0, 0); cream.setTransform(DPR, 0, 0, DPR, 0, 0); cakeX.setTransform(DPR, 0, 0, DPR, 0, 0);
  rebuild(); painted = 0; tops = []; candles = [];

}

// ---------- すすめかた ----------
const ORDER = ['shape', 'cream', 'deco', 'candle', 'party'];
function msg(t) { $('msg').textContent = t; }
function setStep(s) {
  step = s; down = null;
  const i = ORDER.indexOf(s);
  [...$('steps').children].forEach((d, k) => d.className = k < i ? 'done' : k === i ? 'now' : '');
  const bar = $('bar'); bar.innerHTML = ''; $('next').classList.add('hide');
  $('next').textContent = s === 'candle' ? 'でんきを けす 💡' : 'つぎ ▶';
  $('back').classList.toggle('hide', !['cream', 'deco', 'candle'].includes(s));
  const btn = (txt, fn, cls) => { const b = document.createElement('button'); b.innerHTML = txt; if (cls) b.className = cls;
    b.addEventListener('pointerdown', e => { e.stopPropagation(); fn(b); }); bar.appendChild(b); return b; };
  const sel = b => [...bar.children].forEach(c => c.classList.toggle('sel', c === b));
  if (s === 'shape') {
    msg('どんな かたちに する？');
    for (const k in SHAPES) btn(SHAPES[k], b => {
      if (k !== shape) { shape = k; rebuild(); cream.clearRect(0, 0, W, H); painted = 0; paintAt.said = false; tops = []; candles = []; }
      sel(b); S.pop(); $('next').classList.remove('hide'); A.say(A.praise()); }, k === shape ? 'sel' : '');

    if (served >= 4) { ctx.fillStyle = '#f2c879'; for (let i = 0; i < 9; i++) { ctx.beginPath(); ctx.arc(g.cx + Math.sin(i * 7.3) * g.R * .7, g.ty + g.D + Math.cos(i * 3.1) * g.R * .25, U * .7, 0, 7); ctx.fill(); } }

function drawCakeBody(g) {

  ctx.fillStyle = '#f2c879'; ctx.fill(side);
  const mid = new Path2D(); for (let d = g.D * .45; d <= g.D * .58; d += 2) addShape(mid, shape, d);

  sx.addColorStop(.7, 'rgba(110,50,30,.08)'); sx.addColorStop(1, 'rgba(110,50,30,.32)');

  sy.addColorStop(0, 'rgba(110,50,30,0)'); sy.addColorStop(1, 'rgba(110,50,30,.18)');
  ctx.fillStyle = sy; ctx.fillRect(g.cx - g.R * 1.3, g.ty - g.R, g.R * 2.6, g.R * 2 + g.D);
  ctx.restore();
  // うえの めん（あかるく）
  ctx.fillStyle = '#f7d58c'; ctx.fill(TOP);
  ctx.save(); ctx.clip(TOP);
  ctx.drawImage(creamC, 0, 0, W, H);
  const hl = ctx.createRadialGradient(g.cx - g.R * .35, g.ty - g.R * .2, 0, g.cx - g.R * .35, g.ty - g.R * .2, g.R * 1.1);
  hl.addColorStop(0, 'rgba(255,255,255,.28)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hl; ctx.fillRect(g.cx - g.R * 1.3, g.ty - g.R, g.R * 2.6, g.R * 2);
  ctx.restore();

  ctx.strokeStyle = 'rgba(110,50,30,.16)'; ctx.lineWidth = U * 1.1; ctx.stroke(TOP);
  ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = U * .45; ctx.stroke(TOP);
  // つぶつぶ・トッピング（おくから じゅんに）
  const items = tops.map(t => ({ ...t, kind: 't' })).concat(candles.map(c => ({ ...c, kind: 'c' })));
  if (plate && plateImg) { plate.t = Math.min(1, plate.t + .08); items.push({ ...plate, kind: 'p' }); }
  items.sort((a, b) => a.y - b.y);
  for (const it of items) {
    if (it.kind === 't') { const src = tops.find(t => t.x === it.x && t.y === it.y); if (src) src.t = Math.min(1, src.t + .1);
      const k = src ? src.t : 1; drawTop(ctx, it.e, it.x, it.y - (1 - k) * U * 6, g.R * .24 * (1 + (1 - k) * .5), it.v || 0); }
    else if (it.kind === 'p') drawPlate(it);

function drawCandle(c) {
  const h = candleH(), w = geo().R * .045;

  ctx.strokeStyle = '#555'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(c.x, c.y - h); ctx.lineTo(c.x, c.y - h - U); ctx.stroke();
  if (c.lit) {
    const fx = c.x + Math.sin(time * 9 + c.x) * U * .3, fy = c.y - h - U * 1.2, fh = U * 3.2 * (1 + Math.sin(time * 13 + c.y) * .08);
    ctx.fillStyle = '#ffb02e'; ctx.beginPath(); ctx.moveTo(fx, fy - fh); ctx.quadraticCurveTo(fx + U * 1.3, fy - fh * .3, fx, fy); ctx.quadraticCurveTo(fx - U * 1.3, fy - fh * .3, fx, fy - fh); ctx.fill();
    ctx.fillStyle = '#fff6a0'; ctx.beginPath(); ctx.ellipse(fx, fy - fh * .32, U * .45, fh * .25, 0, 0, 7); ctx.fill();
  }
}
function drawGuests() {
  const g = geo(), y = g.ty + g.D + g.R * .35, s = Math.min(U * 13, W * .1);
  const pos = [[g.cx - g.R * 1.55, 0], [g.cx + g.R * 1.55, 1], [g.cx - g.R * 2.15, 2], [g.cx + g.R * 2.15, 3]];
  guests.forEach((e, i) => {
    const [x] = pos[i]; if (x < s * .4 || x > W - s * .4) return;
    const hop = cheer > 0 ? Math.abs(Math.sin(time * 9 + i)) * U * 4 : Math.abs(Math.sin(time * 2 + i)) * U * .8;
    emo(e, x, y - hop - (i > 1 ? U * 4 : 0), i === 0 ? s * 1.15 : s);
    if (i === 0) {
      // とんがりぼうし
      const hx = x, hy = y - hop - s * 1.12;
      ctx.fillStyle = '#ff7eb6'; ctx.beginPath(); ctx.moveTo(hx - s * .22, hy + s * .12); ctx.lineTo(hx, hy - s * .38); ctx.lineTo(hx + s * .22, hy + s * .12); ctx.fill();
      ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(hx, hy - s * .38, s * .07, 0, 7); ctx.fill();
      for (let k = 0; k < 3; k++) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(hx - s * .1 + k * s * .1, hy - s * .02 - k * s * .1, s * .03, 0, 7); ctx.fill(); }
    }
    if (cheer > 0 && i > 0) emo('🎉', x + (i % 2 ? -1 : 1) * s * .5, y - hop - s * .9, s * .45);
  });
}
function drawBG() {
  ctx.fillStyle = '#fff3f8'; ctx.fillRect(0, 0, W, H);
  // かべの もよう
  ctx.fillStyle = '#ffe3f0'; for (let x = 0; x < W; x += U * 14) for (let y = 0; y < H; y += U * 14) { ctx.beginPath(); ctx.arc(x + ((y / (U * 14)) % 2) * U * 7, y, U * 1.6, 0, 7); ctx.fill(); }
  // ガーランド
  ctx.strokeStyle = '#ffb3d1'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, H * .02); ctx.quadraticCurveTo(W / 2, H * .2, W, H * .02); ctx.stroke();
  const fl = ['#ff7eb6', '#ffd23f', '#7fc8ff', '#9be38c'];
  for (let i = 1; i < 14; i++) { const t = i / 14, x = W * t, y = (1 - t) * (1 - t) * H * .02 + 2 * (1 - t) * t * H * .2 + t * t * H * .02;
    ctx.fillStyle = fl[i % 4]; ctx.beginPath(); ctx.moveTo(x - U * 2.2, y); ctx.lineTo(x + U * 2.2, y); ctx.lineTo(x, y + U * 4.5); ctx.fill(); }
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function emo(e, x, y, s) { ctx.font = `${s}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText(e, x, y); }

let last = performance.now();
function loop(now) {
  let dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now;

  const darkT = (step === 'song' && dark > 0) || step === 'blow' ? .78 : 0;
  dark += (darkT - dark) * Math.min(1, dt * 3);

addEventListener('resize', resize);
resize();
newBirthday();
requestAnimationFrame(loop);
